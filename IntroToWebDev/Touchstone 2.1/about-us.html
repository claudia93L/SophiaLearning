    <header>
      <nav>
        <div>
          <div id="logo-div">
            <a href="index.html">
              <img
                src="./assets/Logo.png"
                alt="Book Haven Bookstore Logo.png"
                height="50"
              />
            </a>
          </div>
          <div>
            <h1>About Us</h1>
          </div>
        </div>
        <div>

            <li>
              <a href="index.html">Home</a>

      </nav>

    <main>
      <section id="about">
        <h1>About Us</h1>
        <p></p>
      </section>

      <section id="business-hours">
        <h2>Business Hours</h2>
        <dl>
          <dt>Monday–Friday</dt>
          <dd>9:00–20:00</dd>
          <dt>Saturday</dt>
          <dd>10:00–18:00</dd>
          <dt>Sunday</dt>
          <dd>11:00–17:00</dd>
        </dl>
      </section>

      <section id="contact">
        <h2>Contact & Custom Orders</h2>
        <form>
          <label>Name</label>
          <input type="text" />

          <label>Email</label>
          <input type="email" />

          <label>Phone</label>
          <input type="tel" />

          <label>Feedback / Order Info</label>
          <textarea></textarea>

          <label> <input type="checkbox" /> Custom Order </label>

          <button type="submit">Submit</button>
          <button type="reset">Clear</button>
        </form>
      </section>

      <section id="newsletter">
        <h2>Subscribe</h2>
        <form></form>
      </section>
    </main>

    <footer>
      <section id="newsletter" aria-labelledby="newsletter-title">
        <h2 id="newsletter-title">Subscribe</h2>
        <form>
          <label for="newsletter-email">Newsletter</label>
          <input
            type="email"
            id="newsletter-email"
            name="newsletter-email"
            placeholder="clientemail@gmail.com"
          />
          <button type="submit">Subscribe</button>
        </form>
      </section>
