<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Haven Bookstore | About Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav></nav>
    </header>

    <main>
      <section id="about">
        <h1>About Us</h1>
        <p></p>
      </section>

      <section id="business-hours">
        <h2>Business Hours</h2>
        <dl>
          <dt>Monday–Friday</dt>
          <dd>9:00–20:00</dd>
          <dt>Saturday</dt>
          <dd>10:00–18:00</dd>
          <dt>Sunday</dt>
          <dd>11:00–17:00</dd>
        </dl>
      </section>

      <section id="contact">
        <h2>Contact & Custom Orders</h2>
        <form>
          <label>Name</label>
          <input type="text" />

          <label>Email</label>
          <input type="email" />

          <label>Phone</label>
          <input type="tel" />

          <label>Feedback / Order Info</label>
          <textarea></textarea>

          <label> <input type="checkbox" /> Custom Order </label>

          <button type="submit">Submit</button>
          <button type="reset">Clear</button>
        </form>
      </section>

      <section id="newsletter">
        <h2>Subscribe</h2>
        <form></form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
